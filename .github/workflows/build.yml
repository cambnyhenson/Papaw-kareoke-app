name: Build and release Windows app

# Every push to main builds the installer and publishes it as a public GitHub Release.
# Installed copies of the app check those releases and update themselves.
# Version = major.minor from package.json + this workflow's run number, so every build is newer.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'test/report.png']   # docs-only changes don't ship an update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        id: v
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          ver="$base.${{ github.run_number }}"
          npm version "$ver" --no-git-tag-version
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      # Problem reports: the REPORT_TOKEN repo secret (fine-grained token, this repo only,
      # Issues: read & write) is baked into the app so it can file issues. Skipped if not set.
      - name: Add problem-report key
        shell: bash
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -n "$REPORT_TOKEN" ]; then
            node -e "require('fs').writeFileSync('report.json', JSON.stringify({owner:'cambnyhenson',repo:'Papaw-kareoke-app',token:process.env.REPORT_TOKEN}))"
            echo "Problem reports enabled"
          else
            echo "::warning::REPORT_TOKEN secret not set - Report a Problem will save reports but cannot send them"
          fi
      # Build only; latest.yml (what installed apps read to find updates) is written to dist/.
      - name: Build installer
        run: npx electron-builder --win --publish never
      # Gate: run the built Windows app against the test songs. If anything fails, nothing is
      # published, so a broken version can never auto-install on Grandpa's laptop.
      - name: Smoke test the built app
        shell: bash
        env:
          APP_EXE: dist/win-unpacked/The Butcher Karaoke.exe
        run: node test/ci-smoke.mjs
      - name: Check build output
        shell: bash
        run: ls -la dist && test -f dist/latest.yml && cat dist/latest.yml
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: The Butcher Karaoke ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: The-Butcher-Karaoke-Windows
          path: dist/*.exe
